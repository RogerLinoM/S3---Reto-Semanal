<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 01</title>
</head>
<body>
     <h1>Checkout</h1>
    <form>
        <label>Payment Method</label>
        <select>
            <option>Visa Ending in 4566</option>
            <option>American Express Ending in 9122</option>
            <option>Discover Ending in 9865</option>
        </select>
        
        <br>

        <fieldset>
            <legend>Shipping Method</legend>
        <div>
        <input type="radio" name="Shipping">
        <label> Free - 2 day Shipping</label>
        </div>

        <div>
        <input type="radio" name="Shipping">
        <label>Standard Shipping (4 - 5 Business Days)</label>
        </div>

        <div>
        <input type="radio" name="Shipping">
        <label>FREE - No Rush Shipping (5 Business Days)</label>
        </div>
        </fieldset>

        <label>
            <input type="checkbox" checked>
            This is a gift
        </label>
        <br>
        <button type="submit">Place Your Order</button>
    </form>
</body>
</html>
